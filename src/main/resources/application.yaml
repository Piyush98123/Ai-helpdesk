spring:
  application:
    name: Ai-helpdesk-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/helpdesk_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    autocommit: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.1
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always


  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-16-char-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: false

helpdesk:
  support-email: micik45148@acanok.com
  from-email: your-email@gmail.com

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG


server:
  port: 8090
